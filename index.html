<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Mtg Nexus</title>
    </head>
    <body>
        <header class="main-header">
            <div class="logo">
                <h1>MTG <span> NEXUS</span></h1>
            </div>
            <div class="motto">
                <p> Your one stop shop for buying, selling, and trading Magic Cards</p>
            </div>
            <div class="auth-buttons">
            <a href="#" class="btn login">Login</a>
            <a href="#" class="btn signup">Sign Up</a>
        </div>
        </header>
        <nav class="navbar">
    <div class="nav-left"></div>

    <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Trending</a></li>
        <li><a href="#">Bulk Orders</a></li>
        <li><a href="#">Contact Us</a></li>
    </ul>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search cards here">
        <button onclick="searchCards()">Search</button>
    </div>
</nav>
    <main>
        <section class="cards" id="cardContainers">
        </section>
    </main>
<script>
async function loadCards() {
    const container = document.getElementById("cardContainers");
    container.innerHTML = "";

    try {
        const response = await fetch("https://api.scryfall.com/cards/search?q=type:creature");
        const data = await response.json();

        console.log(data.data.length);

        data.data.slice(0, 12).forEach(card => {
            const cardDiv = document.createElement("div");
            cardDiv.classList.add("card");

            const img = document.createElement("img");
            img.src = card.image_uris?.small 
                || card.card_faces?.[0]?.image_uris?.small 
                || "https://via.placeholder.com/150";

            const name = document.createElement("p");
            name.textContent = card.name;

            cardDiv.appendChild(img);
            cardDiv.appendChild(name);
            container.appendChild(cardDiv);
        });

    } catch (error) {
        container.innerHTML = "<p>Error loading cards.</p>";
        console.error(error);
    }
}

loadCards();
</script>
    </body>
</html>
