<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Mtg Nexus</title>
    </head>
    <body>
        <header class="main-header">
            <div class="logo">
                <h1>MTG <span> NEXUS</span></h1>
            </div>
            <div class="motto">
                <p> Your one stop shop for buying & selling Magic the Gathering Cards!</p>
            </div>
            <div class="auth-buttons">
            <a href="#" class="btn login">Login</a>
            <a href="#" class="btn signup">Sign Up</a>
        </div>
        </header>
        <nav class="navbar">
    <div class="nav-left"></div>

    <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Buy Cards</a></li>
        <li><a href="#">Sell Cards</a></li>
        <li><a href="#">Contact Us</a></li>
    </ul>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search cards here">
        <button onclick="searchCards()">Search</button>
    </div>
</nav>
    <main>
        <section class="cards" id="cardContainers">
        </section>
        <div class="pagination" id="pagination"></div>
    </main>
<script>
document.addEventListener("DOMContentLoaded", () => {

let currentPage = 1;
let totalPages = 20; // we’ll estimate this
const baseURL = "https://api.scryfall.com/cards/search?q=type:creature";

async function loadCards(page = 1) {
    const container = document.getElementById("cardContainers");
    container.innerHTML = "";

    try {
        const url = `${baseURL}&page=${page}`;
        const response = await fetch(url);
        const data = await response.json();

        data.data.slice(0, 24).forEach(card => {
            const cardDiv = document.createElement("div");
            cardDiv.classList.add("card");

            const img = document.createElement("img");
            img.src = card.image_uris?.normal 
                || card.card_faces?.[0]?.image_uris?.normal;

            const name = document.createElement("p");
            name.textContent = card.name;

            cardDiv.appendChild(img);
            cardDiv.appendChild(name);
            container.appendChild(cardDiv);
        });

        renderPagination(page);

    } catch (err) {
        console.error(err);
    }
}
function renderPagination(activePage) {
    const pagination = document.getElementById("pagination");
    pagination.innerHTML = "";

    for (let i = 1; i <= 20; i++) { 
        const btn = document.createElement("button");
        btn.textContent = i;

        if (i === activePage) {
            btn.classList.add("active");
        }

        btn.addEventListener("click", () => {
            currentPage = i;
            loadCards(i);
        });

        pagination.appendChild(btn);
    }
}
loadCards(1);
});
</script>
    </body>
</html>
